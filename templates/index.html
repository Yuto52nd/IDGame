<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ranking Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body class="landing-page">
    <main class="page-shell">
      <section class="hero-card">
        <p class="eyebrow">Party game</p>
        <h1>Ranking Game</h1>
        <p class="subtitle">Create a room, invite your friends, and vote on wild social questions.</p>
      </section>

      <section class="panel-grid">
        <form class="panel" method="post" action="/create">
          <h2>Create room</h2>
          <label>
            <span>Your name</span>
            <input name="name" placeholder="Enter your name" required>
          </label>
          <details class="pack-picker">
            <summary>
              <span class="pack-picker-title">Question mix</span>
              <span class="pack-picker-summary" data-pack-summary>Classic</span>
            </summary>
            <div class="pack-picker-body">
              <div class="pack-picker-header">
                <p class="helper-copy">Choose one or more banks for this room.</p>
                <div class="pack-actions" aria-label="Question bank selection actions">
                  <button type="button" class="text-button" data-pack-action="all">All</button>
                  <button type="button" class="text-button" data-pack-action="clear">Clear</button>
                </div>
              </div>
              <fieldset class="pack-fieldset">
                <legend class="sr-only">Question banks</legend>
                <div class="pack-list">
                  {% for key, bank in question_banks.items() %}
                  <label class="pack-option">
                    <input class="pack-toggle" type="checkbox" name="question_banks" value="{{ key }}"{% if key == 'classic' %} checked{% endif %}>
                    <span>{{ bank.label }}</span>
                  </label>
                  {% endfor %}
                </div>
              </fieldset>
            </div>
          </details>
          <button type="submit">Create lobby</button>
        </form>

        <form class="panel" method="post" action="/join">
          <h2>Join room</h2>
          <label>
            <span>Your name</span>
            <input name="name" placeholder="Enter your name" required>
          </label>
          <label>
            <span>Room code</span>
            <input name="code" placeholder="ABCDE" maxlength="5" required>
          </label>
          <button type="submit">Join game</button>
        </form>
      </section>
    </main>
    <script src="{{ url_for('static', filename='home.js') }}"></script>
  </body>
</html>
